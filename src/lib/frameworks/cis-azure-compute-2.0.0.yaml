# CIS Microsoft Azure Compute Services 2.0.0: rekommendationer med nivå (Level 1–2), automatiserad eller manuell och kopplingar.
# ID, nivå, CIS Controls och Azure Policy-ID kommer från CIS-benchmarken. Rubriker och åtgärder är egna texter (B-45, B-47).

schemaVersion: 1
id: 'cis-azure-compute'
version: '2.0.0'
name: 'CIS Microsoft Azure Compute Services 2.0.0'
language: 'sv'
profiles: ['Level 1', 'Level 2']
riskManagement: false
readiness: false
guidanceLabel: 'Kontrollera'
source: 'ID, nivåer och kopplingar följer CIS Microsoft Azure Compute Services Benchmark v2.0.0 från Center for Internet Security. Rubriker och åtgärder är egna texter.'
sections:
  - id: 'recommendations'
    title: 'Rekommendationer'
    soa: false
    optional: true
    unit: 'rekommendationer'
    groupLabel: 'Områden'
    groups:
      - id: '2'
        title: 'App Service'
        controls:
          - id: '2.5'
            title: 'Hemligheter lagras i Azure Key Vault'
            profile: 2
            automated: false
            remediation: 'Flytta hemligheter från appinställningar till Key Vault och referera till dem med Key Vault-referenser och hanterad identitet.'
            refs: ['CIS Controls v8: 3.1']
          - id: '2.6'
            title: 'App Service Environment driftsätts med intern lastbalanserare'
            profile: 2
            automated: true
            remediation: 'Driftsätt App Service Environment med intern lastbalanserare (ILB) och exponera publika appar via Application Gateway med WAF.'
            refs: ['CIS Controls v8: 3.3', 'Azure Policy: 2d048aca-6479-4923-88f5-e2ac295d9af3']
          - id: '2.7'
            title: 'App Service Environment är version 3 eller senare'
            profile: 1
            automated: true
            remediation: 'Migrera äldre App Service Environment (v1 och v2, som inte längre har support) till v3.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: eb4d34ab-0929-491c-bbf3-61e13da19f9a']
          - id: '2.8'
            title: 'Intern kryptering är aktiverad i App Service Environment'
            profile: 2
            automated: true
            remediation: 'Aktivera intern kryptering (InternalEncryption) i App Service Environment-konfigurationen.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: fb74e86f-d351-4b8d-b034-93da7391c01f']
          - id: '2.9'
            title: 'TLS 1.0 och 1.1 är inaktiverade i App Service Environment'
            profile: 1
            automated: true
            remediation: 'Sätt DisableTls1.0 i App Service Environment-konfigurationen så att bara TLS 1.2 eller senare tillåts.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: d6545c6b-dd9d-4265-91e6-0b451e2f1c50']
          - id: '2.10'
            title: 'Ordningen för TLS-chiffersviter är konfigurerad i App Service Environment'
            profile: 1
            automated: true
            remediation: 'Ange FrontEndSSLCipherSuiteOrder med starka chiffersviter i App Service Environment-konfigurationen.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: 817dcf37-e83d-4999-a472-644eada2ea1e']
      - id: '2.1'
        title: 'App Service-appar'
        controls:
          - id: '2.1.1'
            title: 'Java-versionen har support (om Java används)'
            profile: 1
            automated: false
            remediation: 'Under Konfiguration › Allmänna inställningar: välj en Java-version som har support och planera uppgradering innan supporten upphör.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: 496223c3-ad65-4ecd-878a-bae78737e9ed']
          - id: '2.1.2'
            title: 'Python-versionen har support (om Python används)'
            profile: 1
            automated: false
            remediation: 'Under Konfiguration › Allmänna inställningar: välj en Python-version som har support.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: 7008174a-fd10-4ef0-817e-fc820a951d73']
          - id: '2.1.3'
            title: 'PHP-versionen har support (om PHP används)'
            profile: 1
            automated: false
            remediation: 'Under Konfiguration › Allmänna inställningar: välj en PHP-version som har support.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: 7261b898-8a84-4db8-9e04-18527132abb3']
          - id: '2.1.4'
            title: 'Publicering med grundläggande autentisering är inaktiverad'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: stäng av SCM och FTP Basic Auth Publishing Credentials. Publicera via Entra ID, t.ex. GitHub Actions med OIDC.'
            refs: ['CIS Controls v8: 5.6', 'Azure Policy: 871b205b-57cf-4e1e-a234-492616998bf7', 'Azure Policy: aede300b-d67f-480a-ae26-4b3dfb1a1fdc']
          - id: '2.1.5'
            title: 'FTP är inaktiverat eller tillåter bara FTPS'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt FTP-tillstånd till Inaktiverat, eller Endast FTPS om FTP behövs.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: 4d24b6d4-5e53-4a4f-a7f4-618fa573ee4b']
          - id: '2.1.6'
            title: 'HTTP/2 används (om tillämpligt)'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt HTTP-versionen till 2.0.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: 8c122334-9d20-4eb8-89ea-ac9a705b74ae']
          - id: '2.1.7'
            title: 'Bara HTTPS är tillåtet'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: aktivera Endast HTTPS (az webapp update --https-only true).'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: a4af4a39-4135-47fb-b175-47fbdf85311d']
          - id: '2.1.8'
            title: 'Inkommande trafik kräver minst TLS 1.2'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt lägsta inkommande TLS-version till 1.2 eller 1.3.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: f0e6e85b-9b9f-4a4b-b67b-f730d42f1b0b']
          - id: '2.1.9'
            title: 'TLS-kryptering hela vägen (end-to-end) är aktiverad'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: aktivera End-to-end TLS encryption så att trafiken krypteras även inne i plattformen.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: af1d7e88-c1c8-4ea8-be1f-87bff0df9101']
          - id: '2.1.10'
            title: 'Fjärrfelsökning är avstängd'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: stäng av fjärrfelsökning. Slå bara på tillfälligt vid behov.'
            refs: ['CIS Controls v8: 12.3', 'Azure Policy: cb510bfd-1cba-4d9f-a230-cb0976f4bb71']
          - id: '2.1.11'
            title: 'Klientcertifikat krävs för inkommande anrop (om tillämpligt)'
            profile: 2
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt klientcertifikatläge till Obligatoriskt för appar som ska kräva ömsesidig TLS.'
            refs: ['CIS Controls v8: 12.6', 'Azure Policy: 19dd1db6-f442-49cf-a838-b0786b4401ef']
          - id: '2.1.12'
            title: 'Autentisering i App Service är aktiverad'
            profile: 2
            automated: true
            remediation: 'Under Autentisering: lägg till Microsoft som identitetsleverantör och kräv inloggning för oautentiserade anrop.'
            refs: ['CIS Controls v8: 3.3', 'Azure Policy: 95bccee9-a7f8-4bec-9ee9-62c3473701fc']
          - id: '2.1.13'
            title: 'Hanterade identiteter är konfigurerade'
            profile: 1
            automated: true
            remediation: 'Under Identitet: aktivera systemtilldelad eller användartilldelad hanterad identitet och använd den mot andra Azure-tjänster i stället för nycklar.'
            refs: ['CIS Controls v8: 5.6', 'Azure Policy: 2b9ad585-36bc-4615-b300-fd4435808332']
          - id: '2.1.14'
            title: 'Publik nätverksåtkomst är inaktiverad'
            profile: 1
            automated: true
            remediation: 'Under Nätverk › Åtkomst för inkommande trafik: stäng av publik åtkomst och använd privata slutpunkter.'
            refs: ['CIS Controls v8: 3.3, 4.4', 'Azure Policy: 1b5ef780-c53c-4a64-87f3-bb9c8c8094ba']
          - id: '2.1.15'
            title: 'App Service-planens SKU stöder privata slutpunkter'
            profile: 2
            automated: true
            remediation: 'Använd en App Service-plan på nivån Basic eller högre (helst Premium v3) som stöder privata slutpunkter.'
            refs: ['CIS Controls v8: 12.2', 'Azure Policy: 546fe8d2-368d-4029-a418-6af48a7f61e5']
          - id: '2.1.16'
            title: 'Privata slutpunkter används för åtkomst till App Service-appar'
            profile: 2
            automated: true
            remediation: 'Under Nätverk: lägg till en privat slutpunkt för appen.'
            refs: ['CIS Controls v8: 12.2', 'Azure Policy: 687aa49d-0982-40f8-bf6b-66d1da97a04b']
          - id: '2.1.17'
            title: 'Privata slutpunkter till App Service-appar använder privata DNS-zoner'
            profile: 2
            automated: false
            remediation: 'Koppla den privata slutpunkten till den privata DNS-zonen privatelink.azurewebsites.net.'
            refs: ['CIS Controls v8: 12.2']
          - id: '2.1.18'
            title: 'Appen är integrerad med ett virtuellt nätverk'
            profile: 1
            automated: true
            remediation: 'Under Nätverk: aktivera VNet-integrering mot ett dedikerat subnät.'
            refs: ['CIS Controls v8: 12.2', 'Azure Policy: 72d04c29-f87d-4575-9731-419ff16a2757']
          - id: '2.1.19'
            title: 'Konfigurationstrafik går via integrationen med det virtuella nätverket'
            profile: 2
            automated: true
            remediation: 'Under Nätverk › VNet-integrering: aktivera dirigering av konfigurationstrafik (t.ex. hämtning av containeravbildning och innehållsdelning) via det virtuella nätverket.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: 801543d1-1953-4a90-b8b0-8cf6d41473a5']
          - id: '2.1.20'
            title: 'All trafik går via det virtuella nätverket'
            profile: 1
            automated: true
            remediation: 'Under Nätverk › VNet-integrering: aktivera Route All (vnetRouteAllEnabled) så att all utgående trafik går via det virtuella nätverket.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: a691eacb-474d-47e4-b287-b4813ca44222']
          - id: '2.1.21'
            title: 'CORS tillåter inte alla ursprung'
            profile: 2
            automated: true
            remediation: 'Under API › CORS: ta bort * och ange bara de ursprung som behöver anropa appen.'
            refs: ['CIS Controls v8: 16.1', 'Azure Policy: 5744710e-cc2f-4ee8-8809-3b11e89f4bc9']
