            refs: ['CIS Controls v8: 3.3', 'Azure Policy: 969ac98b-88a8-449f-883c-2e9adb123127']
          - id: '2.3.14'
            title: 'Funktionsappen är integrerad med ett virtuellt nätverk'
            profile: 1
            automated: true
            remediation: 'Under Nätverk: aktivera VNet-integrering mot ett dedikerat subnät (kräver Premium- eller Flex Consumption-plan).'
            refs: ['CIS Controls v8: 12.2']
          - id: '2.3.15'
            title: 'Konfigurationstrafik går via integrationen med det virtuella nätverket'
            profile: 2
            automated: true
            remediation: 'Under Nätverk › VNet-integrering: aktivera dirigering av konfigurationstrafik (t.ex. hämtning av containeravbildning och innehållsdelning) via det virtuella nätverket.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: 5e57f5ad-995a-485b-9f42-4748935ee5d9']
          - id: '2.3.16'
            title: 'All trafik går via det virtuella nätverket'
            profile: 1
            automated: true
            remediation: 'Under Nätverk › VNet-integrering: aktivera Route All (vnetRouteAllEnabled) så att all utgående trafik går via det virtuella nätverket.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: 32a913ec-5ed7-4b31-a5b0-198450d8fb13']
          - id: '2.3.17'
            title: 'CORS tillåter inte alla ursprung'
            profile: 2
            automated: true
            remediation: 'Under API › CORS: ta bort * och ange bara de ursprung som behöver anropa appen.'
            refs: ['CIS Controls v8: 16.1', 'Azure Policy: 0820b7b9-23aa-4725-a1ce-ae4558f718e5']
      - id: '2.4'
        title: 'Distributionsplatser för funktionsappar'
        controls:
          - id: '2.4.1'
            title: 'Java-versionen har support (om Java används)'
            profile: 1
            automated: false
            remediation: 'Under Konfiguration › Allmänna inställningar: välj en Java-version som har support och planera uppgradering innan supporten upphör.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: e1d1b522-02b0-4d18-a04f-5ab62d20445f']
          - id: '2.4.2'
            title: 'Python-versionen har support (om Python används)'
            profile: 1
            automated: false
            remediation: 'Under Konfiguration › Allmänna inställningar: välj en Python-version som har support.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: 829b40f3-d3db-4fd2-be46-76663d3aeeb2']
          - id: '2.4.3'
            title: 'Publicering med grundläggande autentisering är inaktiverad'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: stäng av SCM och FTP Basic Auth Publishing Credentials. Publicera via Entra ID, t.ex. GitHub Actions med OIDC.'
            refs: ['CIS Controls v8: 5.6']
          - id: '2.4.4'
            title: 'FTP är inaktiverat eller tillåter bara FTPS'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt FTP-tillstånd till Inaktiverat, eller Endast FTPS om FTP behövs.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: e1a09430-221d-4d4c-a337-1edb5a1fa9bb']
          - id: '2.4.5'
            title: 'HTTP/2 används (om tillämpligt)'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt HTTP-versionen till 2.0.'
            refs: ['CIS Controls v8: 2.2', 'Azure Policy: fa98f1b1-1f56-4179-9faf-93ad82f3458f']
          - id: '2.4.6'
            title: 'Bara HTTPS är tillåtet'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: aktivera Endast HTTPS (az webapp update --https-only true).'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: 5e5dbe3f-2702-4ffc-8b1e-0cae008a5c71']
          - id: '2.4.7'
            title: 'Inkommande trafik kräver minst TLS 1.2'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt lägsta inkommande TLS-version till 1.2 eller 1.3.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: deb528de-8f89-4101-881c-595899253102']
          - id: '2.4.8'
            title: 'TLS-kryptering hela vägen (end-to-end) är aktiverad'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: aktivera End-to-end TLS encryption så att trafiken krypteras även inne i plattformen.'
            refs: ['CIS Controls v8: 3.10', 'Azure Policy: cbe0e5eb-fea9-491d-ab20-a62cf049c5ae']
          - id: '2.4.9'
            title: 'Fjärrfelsökning är avstängd'
            profile: 1
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: stäng av fjärrfelsökning. Slå bara på tillfälligt vid behov.'
            refs: ['CIS Controls v8: 12.3', 'Azure Policy: 89691ef9-8c50-49a8-8950-9c7fba41699e']
          - id: '2.4.10'
            title: 'Klientcertifikat krävs för inkommande anrop (om tillämpligt)'
            profile: 2
            automated: true
            remediation: 'Under Konfiguration › Allmänna inställningar: sätt klientcertifikatläge till Obligatoriskt för appar som ska kräva ömsesidig TLS.'
            refs: ['CIS Controls v8: 3.3', 'Azure Policy: 153ab4ca-2d58-4b5d-9134-6d8c6bdd321c']
          - id: '2.4.11'
            title: 'Hanterade identiteter är konfigurerade'
            profile: 1
            automated: true
            remediation: 'Under Identitet: aktivera systemtilldelad eller användartilldelad hanterad identitet och använd den mot andra Azure-tjänster i stället för nycklar.'
            refs: ['CIS Controls v8: 5.6']
          - id: '2.4.12'
            title: 'Publik nätverksåtkomst är inaktiverad'
            profile: 1
            automated: true
            remediation: 'Under Nätverk › Åtkomst för inkommande trafik: stäng av publik åtkomst och använd privata slutpunkter.'
            refs: ['CIS Controls v8: 3.3', 'Azure Policy: 11c82d0c-db9f-4d7b-97c5-f3f9aa957da2']
          - id: '2.4.13'
            title: 'Distributionsplatsen är integrerad med ett virtuellt nätverk'
            profile: 1
            automated: true
            remediation: 'Under Nätverk på distributionsplatsen: aktivera VNet-integrering mot samma nätverk som produktionsplatsen.'
            refs: ['CIS Controls v8: 12.2']
          - id: '2.4.14'
            title: 'Konfigurationstrafik går via integrationen med det virtuella nätverket'
            profile: 2
            automated: true
            remediation: 'Under Nätverk › VNet-integrering: aktivera dirigering av konfigurationstrafik (t.ex. hämtning av containeravbildning och innehållsdelning) via det virtuella nätverket.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: f380edf5-de79-4862-bd57-ee407d8bd8b6']
          - id: '2.4.15'
            title: 'All trafik går via det virtuella nätverket'
            profile: 1
            automated: true
            remediation: 'Under Nätverk › VNet-integrering: aktivera Route All (vnetRouteAllEnabled) så att all utgående trafik går via det virtuella nätverket.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: 75c42c42-dfb3-453d-8fd5-9f978e1b1106']
          - id: '2.4.16'
            title: 'CORS tillåter inte alla ursprung'
            profile: 2
            automated: true
            remediation: 'Under API › CORS: ta bort * och ange bara de ursprung som behöver anropa appen.'
            refs: ['CIS Controls v8: 16.1', 'Azure Policy: a1a22235-dd10-4062-bd55-7d62778f41b0']
      - id: '3'
        title: 'Azure Container Instances'
        controls:
          - id: '3.1'
            title: 'Container Instances använder privata virtuella nätverk'
            profile: 1
            automated: false
            remediation: 'Driftsätt containergrupper i ett virtuellt nätverk i stället för med publik IP-adress.'
            refs: ['CIS Controls v8: 12.2']
          - id: '3.2'
            title: 'Hanterad identitet används mot andra Azure-tjänster'
            profile: 1
            automated: false
            remediation: 'Aktivera hanterad identitet på containergruppen och använd den mot t.ex. Key Vault och lagring i stället för nycklar.'
            refs: ['CIS Controls v8: 6.7, 6.8']
          - id: '3.3'
            title: 'Hanterade identiteter tilldelas roller enligt principen om minsta behörighet'
            profile: 1
            automated: false
            remediation: 'Ge den hanterade identiteten bara de roller och den omfattning som behövs, t.ex. Key Vault Secrets User på ett enskilt valv.'
            refs: ['CIS Controls v8: 5.5, 6.8']
      - id: '4'
        title: 'Azure CycleCloud'
        controls:
          - id: '4.1'
            title: 'SSL är konfigurerat för CycleCloud'
            profile: 1
            automated: false
            remediation: 'Konfigurera HTTPS med ett giltigt certifikat för CycleCloud-webbgränssnittet och stäng HTTP.'
            refs: ['CIS Controls v8: 3.10']
      - id: '15'
        title: 'Batch'
        controls:
          - id: '15.1'
            title: 'Batch-konton krypterar data med kundhanterade nycklar'
            profile: 2
            automated: false
            remediation: 'Under Kryptering på Batch-kontot: välj kundhanterade nycklar från Key Vault.'
            refs: ['CIS Controls v8: 3.11', 'Azure Policy: 99e9ccd8-3db9-4592-b0d1-14b1715a4d8a']
          - id: '15.2'
            title: 'Diskkryptering är aktiverad för Batch-pooler'
            profile: 1
            automated: true
            remediation: 'Ange diskkryptering (OsDisk och TemporaryDisk) när poolen skapas. Befintliga pooler måste skapas om.'
            refs: ['CIS Controls v8: 3.11', 'Azure Policy: 1760f9d4-7206-436e-a28f-d9f3a5c8a227']
          - id: '15.3'
            title: 'Lokala autentiseringsmetoder är inaktiverade för Batch-konton'
            profile: 1
            automated: true
            remediation: 'Stäng av autentisering med delad nyckel (allowedAuthenticationModes) och använd Entra ID.'
            refs: ['CIS Controls v8: 5.6', 'Azure Policy: 4dbc2f5c-51cf-4e38-9179-c7028eed2274', 'Azure Policy: 6f68b69f-05fe-49cd-b361-777ee9ca7e35']
          - id: '15.4'
            title: 'Privata slutpunkter har övervägts för Batch-konton'
            profile: 2
            automated: true
            remediation: 'Bedöm behovet och skapa privata slutpunkter för Batch-kontot när det ska nås från interna nätverk.'
            refs: ['CIS Controls v8: 12.2', 'Azure Policy: 0ef5aac7-c064-427a-b87b-d47b3ddcaf73']
          - id: '15.5'
            title: 'Publik nätverksåtkomst är inaktiverad för Batch-konton'
            profile: 1
            automated: true
            remediation: 'Under Nätverk: stäng av publik nätverksåtkomst och använd privata slutpunkter.'
            refs: ['CIS Controls v8: 13.4', 'Azure Policy: c520cefc-285f-40f3-86e2-2efc38ef1f64', 'Azure Policy: 74c5a0ae-5e48-4738-b093-65e23a060488']
          - id: '15.6'
            title: 'Privata DNS-zoner är konfigurerade för privata slutpunkter till Batch-konton'
            profile: 2
            automated: false
            remediation: 'Koppla de privata slutpunkterna till den privata DNS-zonen privatelink.batch.azure.com.'
            refs: ['CIS Controls v8: 12.2', 'Azure Policy: 4ec38ebc-381f-45ee-81a4-acbc4be878f8']
          - id: '15.7'
            title: 'Diagnostikloggar är aktiverade för Batch-konton'
            profile: 1
            automated: true
            remediation: 'Lägg till en diagnostikinställning på Batch-kontot som skickar ServiceLogs till Log Analytics.'
            refs: ['CIS Controls v8: 8.5, 8.9', 'Azure Policy: 428256e6-1fac-4f48-a757-df34c2b3336d']
      - id: '20'
        title: 'Virtuella maskiner'
        controls:
          - id: '20.1'
            title: 'Virtuella maskiner använder hanterade diskar'
            profile: 1
            automated: true
            remediation: 'Konvertera ohanterade diskar till hanterade diskar (az vm convert).'
            refs: ['CIS Controls v8: 3.11', 'Azure Policy: 06a78e20-9358-41c9-923c-fb736d382a4d']
          - id: '20.2'
            title: 'OS- och datadiskar krypteras med kundhanterad nyckel (CMK)'
            profile: 2
            automated: true
            remediation: 'Skapa en diskkrypteringsuppsättning med nyckel i Key Vault och koppla diskarna till den.'
            refs: ['CIS Controls v8: 3.11', 'Azure Policy: ca88aadc-6e2b-416c-9de2-5a0f01d1693f', 'Azure Policy: 3dc5edcd-002d-444c-b216-e123bbfa37c0']
          - id: '20.3'
            title: 'Oanslutna diskar krypteras med kundhanterad nyckel (CMK)'
            profile: 2
            automated: true
            remediation: 'Koppla oanslutna diskar till en diskkrypteringsuppsättning med kundhanterad nyckel, eller ta bort diskar som inte behövs.'
            refs: ['CIS Controls v8: 3.11', 'Azure Policy: ca91455f-eace-4f96-be59-e6e2c35b4816']
          - id: '20.4'
            title: 'Diskar är inte publikt åtkomliga från alla nätverk'
            profile: 1
            automated: true
            remediation: 'Under Nätverk på disken: välj Inaktivera publik och privat åtkomst, eller privat åtkomst via diskåtkomstresurs.'
            refs: ['CIS Controls v8: 4.6', 'Azure Policy: 8405fdab-1faf-48aa-b702-999c9c172094']
          - id: '20.5'
            title: 'Autentiseringsläge för dataåtkomst är aktiverat för diskar'
            profile: 1
            automated: true
            remediation: 'Aktivera Entra ID-autentisering för export och import av diskdata (dataAccessAuthMode = AzureActiveDirectory).'
            refs: ['CIS Controls v8: 4.6']
          - id: '20.6'
            title: 'Bara godkända tillägg är installerade'
            profile: 1
            automated: false
            remediation: 'Gå igenom tilläggen på varje virtuell maskin och ta bort de som inte är godkända. Styr tillåtna tillägg med Azure Policy.'
            refs: ['CIS Controls v8: 2.1', 'Azure Policy: c0e996f8-39cf-4af9-9f45-83fbde810432']
          - id: '20.7'
            title: 'Slutpunktsskydd är installerat på alla virtuella maskiner'
            profile: 2
            automated: false
            remediation: 'Aktivera Defender for Servers med integrationen mot Defender for Endpoint, eller installera annat godkänt slutpunktsskydd.'
            refs: ['CIS Controls v8: 10.2', 'Azure Policy: 501541f7-f7e7-4cd6-868c-4190fdad3ac9']
          - id: '20.8'
            title: '[Äldre] VHD-filer är krypterade'
            profile: 2
            automated: false
            remediation: 'Kryptera ohanterade VHD-filer eller, hellre, konvertera till hanterade diskar som krypteras automatiskt.'
            refs: ['CIS Controls v8: 3.11', 'Azure Policy: 702dd420-7fcc-42c5-afe8-4026edd20fe0']
          - id: '20.9'
            title: 'Bara identiteter med MFA har åtkomst till privilegierade virtuella maskiner'
            profile: 2
            automated: false
            remediation: 'Kräv MFA med villkorsstyrd åtkomst för alla som har roller som ger inloggning eller administration på virtuella maskiner.'
            refs: ['CIS Controls v8: 6.5']
          - id: '20.10'
            title: 'Trusted Launch är aktiverat på virtuella maskiner'
            profile: 1
            automated: true
            remediation: 'Aktivera Trusted Launch med säker start och vTPM. Nya maskiner får det som standard; äldre Gen2-maskiner kan uppgraderas.'
            refs: ['CIS Controls v8: 4.1', 'Azure Policy: c95b54ad-0614-4633-ab29-104b01235cbf']
          - id: '20.11'
            title: 'Kryptering på värden (encryption at host) är aktiverad'
            profile: 1
            automated: true
            remediation: 'Registrera funktionen EncryptionAtHost och aktivera den på maskinen när den är avstängd (az vm update --set securityProfile.encryptionAtHost=true).'
            refs: ['CIS Controls v8: 3.10, 3.11', 'Azure Policy: fc4d8e41-e223-45ea-9bf5-eada37891d87']
